  const scale=view==='inside'?1:Math.max(0.5,1-(o.mid[2]-dist)/200); ctx.lineWidth=(isHL?9:(o.b.tube.endsWith('1')?5:3.5))*scale;ctx.strokeStyle=isHL?'#ffe600':col;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(...p1);ctx.lineTo(...p2);ctx.stroke();
  const pm=proj(o.mid); if(o.mid[2]>NEAR){hits.push({type:'bar',id:o.b.id,x:pm[0],y:pm[1]});
   if(opt('arrows')){const q7=cam(lerp(N[o.b.frm],N[o.b.to],0.72),c),q6=cam(lerp(N[o.b.frm],N[o.b.to],0.62),c);if(q7[2]>NEAR&&q6[2]>NEAR){const p7=proj(q7),p6=proj(q6);const ang=Math.atan2(p7[1]-p6[1],p7[0]-p6[0]);ctx.fillStyle=isHL?'#ffe600':col;ctx.beginPath();ctx.moveTo(p7[0],p7[1]);ctx.lineTo(p7[0]-10*Math.cos(ang-0.5),p7[1]-10*Math.sin(ang-0.5));ctx.lineTo(p7[0]-10*Math.cos(ang+0.5),p7[1]-10*Math.sin(ang+0.5));ctx.closePath();ctx.fill();}}
   if(opt('barlab')){let t=String(o.b.id); if(opt('chlab'))t+=' · c'+o.b.ctrl+'.'+o.b.ch; pill(pm[0],pm[1],t,isHL?'#000':col,isHL?'#ffe600':'rgba(15,26,32,0.9)',Math.round(12*Math.max(0.7,scale)),true);}
   if(opt('layers')){for(const [nid,L] of [[o.b.frm,o.b.lfrm],[o.b.to,o.b.lto]]){const other=nid===o.b.frm?o.b.to:o.b.frm;const q=cam(lerp(N[nid],N[other],0.2),c);if(q[2]>NEAR){const p=proj(q);pill(p[0],p[1],'L'+L,'#0f1a20','#ffe066',10,true);}}}}}
 // nodes
 const nl=DATA.nodes.map(n=>({n,q:cam([n.x,n.y,n.z],c)})).filter(o=>o.q[2]>NEAR&&(view==='inside'||far||o.q[2]<=dist)).sort((a,b)=>b.q[2]-a.q[2]);
 for(const o of nl){const p=proj(o.q);hits.push({type:'node',id:o.n.id,x:p[0],y:p[1]});const isHL=hl.node===o.n.id;
  const fc={'5-way':'#ffe0bf','6-way':'#d8e9f3','6-way SEAM':'#ead7f0'}[o.n.hub]; const r=view==='inside'?13:11;
  ctx.beginPath();ctx.arc(p[0],p[1],r,0,6.283);ctx.fillStyle=isHL?'#ffe600':fc;ctx.fill();ctx.lineWidth=isHL?3:1.5;ctx.strokeStyle=isHL?'#000':'#0f1a20';ctx.stroke();
  if(opt('nodelab')){ctx.fillStyle='#0f1a20';ctx.font='700 12px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(o.n.id,p[0],p[1]+0.5);}}
 // compass
 ctx.fillStyle='#9fb6bf';ctx.font='11px system-ui';ctx.textAlign='left';ctx.textBaseline='alphabetic';
 ctx.fillText((view==='inside'?'INSIDE VIEW · looking ':'OUTSIDE VIEW · ')+'yaw '+Math.round(yaw*180/Math.PI)+'° pitch '+Math.round(pitch*180/Math.PI)+'°  ·  z up = top pole (joint 41)',10,H-10);
}
// ---- interaction ----
let drag=null,pinch=null;
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,moved:false};cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{if(!drag||pinch)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>3)drag.moved=true;
 const k=0.006*(fov/60); const sgn=(view==='inside'?1:-1); yaw+=sgn*k*dx; pitch+=k*dy;   // scene follows the finger in both modes
 pitch=Math.max(-1.5,Math.min(1.5,pitch));drag.x=e.clientX;drag.y=e.clientY;draw();});
cv.addEventListener('pointerup',e=>{if(drag&&!drag.moved)pick(e.clientX,e.clientY);drag=null;});
cv.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY>0?1.08:0.93);},{passive:false});
cv.addEventListener('touchstart',e=>{if(e.touches.length===2){pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);}},{passive:true});
cv.addEventListener('touchmove',e=>{if(e.touches.length===2&&pinch){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);zoom(pinch/d);pinch=d;}},{passive:true});
cv.addEventListener('touchend',e=>{if(e.touches.length<2)pinch=null;},{passive:true});
function zoom(f){if(view==='inside'){fov=Math.max(30,Math.min(130,fov*f));}else{dist=Math.max(70,Math.min(600,dist*f));}draw();}
function pick(x,y){let best=null,bd=18;for(const h of hits){const d=Math.hypot(h.x-x,h.y-y);if(d<bd){bd=d;best=h;}}
 if(!best){hl={bar:null,node:null};info('Tap a bar or joint for details.');draw();return;}
 if(best.type==='bar'){showBar(best.id);}else{showNode(best.id);} draw();}
function info(h){document.getElementById('info').innerHTML=h;}
function showBar(id){const b=B[id];hl={bar:id,node:null};
 info('<b style="color:#e2711d">BAR '+id+'</b> · '+b.tube+' ('+(b.size==='A'?'short 30"':'long 34"')+(b.tube.endsWith('1')?', thick wall':'')+') · '+b.leds+' LEDs<br>data <b>'+b.frm+' → '+b.to+'</b> · controller '+b.ctrl+' ch '+b.ch+' · #'+(b.pos+1)+' in chain<br>layer <b>'+b.lfrm+'</b> at joint '+b.frm+', layer <b>'+b.lto+'</b> at joint '+b.to+'<br>sub-assembly: '+(b.wheel===0?'pole star P0':b.wheel===41?'pole star P41':b.wheel===-1?'loose bar':'wheel W'+b.wheel));}
function showNode(id){const n=N[id];hl={node:id,bar:null};const at=DATA.bars.filter(b=>b.frm===id||b.to===id).map(b=>({b,L:b.frm===id?b.lfrm:b.lto,o:b.frm===id?b.to:b.frm})).sort((a,b)=>a.L-b.L);
 info('<b style="color:#e2711d">JOINT '+id+'</b> · '+n.hub+' · ring '+n.ring+'<br>'+at.map(x=>'L'+x.L+': bar <b>'+x.b.id+'</b> ('+x.b.tube+') → '+x.o).join('<br>'));}
function aimAt(p){const l=Math.hypot(p[0],p[1],p[2]);if(view==='inside'){yaw=Math.atan2(p[1],p[0]);pitch=Math.asin(p[2]/l);}else{yaw=Math.atan2(p[1],p[0]);pitch=Math.asin(p[2]/l);}draw();}
document.getElementById('go').onclick=()=>{const id=parseInt(document.getElementById('find').value);if(B[id]){showBar(id);const a=N[B[id].frm],d=N[B[id].to];aimAt(lerp(a,d,0.5));}};
document.getElementById('gon').onclick=()=>{const id=parseInt(document.getElementById('find').value);if(N[id]){showNode(id);aimAt([N[id].x,N[id].y,N[id].z]);}};
document.getElementById('clear').onclick=()=>{hl={bar:null,node:null};info('Tap a bar or joint for details.');draw();};
document.getElementById('up').onclick=()=>{pitch=view==='inside'?1.5:0.35;draw();};
const aim=document.getElementById('aim');aim.innerHTML='<option value="">—</option>'+DATA.nodes.map(n=>'<option value="'+n.id+'">'+n.id+' ('+n.hub+')</option>').join('');
aim.onchange=()=>{const id=parseInt(aim.value);if(N[id]){showNode(id);aimAt([N[id].x,N[id].y,N[id].z]);}};
document.querySelectorAll('input[name=view]').forEach(r=>r.onchange=()=>{view=r.value;if(view==='outside'){fov=45;}else{fov=95;}draw();});
document.querySelectorAll('#ui input,#ui select').forEach(el=>el.addEventListener('change',draw));
document.getElementById('find').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('go').click();});
const tg=document.getElementById('toggle'),ui=document.getElementById('ui');
if(innerWidth<600){tg.style.display='block';ui.style.display='none';ui.style.top='40px';}
tg.onclick=()=>{ui.style.display=ui.style.display==='none'?'block':'none';};
resize();
</script></body></html>
